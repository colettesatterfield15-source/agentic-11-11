<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Cat riding a polka-dot bicycle underwater</title>
  <desc id="desc">An animated flat illustration of an orange tabby cat riding a teal polka-dot bicycle on the sea floor, surrounded by rising bubbles, swaying seaweed, light rays and fish.</desc>

  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9e7f4"/>
      <stop offset="50%" stop-color="#57b9d8"/>
      <stop offset="100%" stop-color="#15658a"/>
    </linearGradient>

    <style>
      /* gentle floating of the whole rider + bike */
      @keyframes floaty {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-5px); }
      }
      .float { animation: floaty 5s ease-in-out infinite; }

      /* bubbles rising and fading */
      @keyframes rise {
        0%   { transform: translateY(0);      opacity: 0; }
        8%   { opacity: 0.85; }
        85%  { opacity: 0.55; }
        100% { transform: translateY(-320px); opacity: 0; }
      }
      .bubble { animation-name: rise; animation-timing-function: linear; animation-iteration-count: infinite; }
      @keyframes wiggle {
        from { transform: translateX(-3px); }
        to   { transform: translateX(3px); }
      }
      .bubble circle { animation: wiggle 3.2s ease-in-out infinite alternate; }

      /* seaweed swaying from its base */
      @keyframes sway {
        from { transform: rotate(-6deg); }
        to   { transform: rotate(6deg); }
      }
      .weed {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: sway 3.6s ease-in-out infinite alternate;
      }
      .weed.slow { animation-duration: 4.8s; animation-delay: -1.6s; }

      /* light rays shimmering */
      @keyframes shimmer {
        0%, 100% { opacity: 0.10; transform: skewX(-5deg) scaleX(1); }
        50%      { opacity: 0.28; transform: skewX(4deg) scaleX(1.06); }
      }
      .ray {
        transform-box: fill-box;
        transform-origin: top center;
        animation: shimmer 7s ease-in-out infinite;
      }
      .ray:nth-of-type(2) { animation-delay: -2.4s; animation-duration: 9s; }
      .ray:nth-of-type(3) { animation-delay: -4.1s; animation-duration: 8s; }

      /* fish crossing the scene */
      @keyframes swim {
        0%   { transform: translateX(-80px); }
        100% { transform: translateX(500px); }
      }
      .fish { animation: swim 24s linear infinite; }
      .fish.f2 { animation-duration: 32s; animation-delay: -14s; }

      /* speed lines */
      @keyframes dash {
        0%, 100% { opacity: 0.25; }
        50%      { opacity: 0.6; }
      }
      .speed { animation: dash 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- water -->
  <rect width="400" height="320" fill="url(#water)"/>

  <!-- surface glow -->
  <path d="M0 0 H400 V26 Q340 40 280 28 T160 30 T40 26 T0 30 Z" fill="#dff9ff" opacity="0.35"/>

  <!-- light rays -->
  <g fill="#eafcff">
    <polygon class="ray" points="52,0 96,0 176,320 108,320"/>
    <polygon class="ray" points="176,0 208,0 268,320 214,320"/>
    <polygon class="ray" points="292,0 330,0 392,320 336,320"/>
  </g>

  <!-- distant fish -->
  <g transform="translate(0,86)">
    <g class="fish">
      <path d="M0 0 q14 -9 28 0 q-14 9 -28 0 Z" fill="#dff6fc" opacity="0.55"/>
      <path d="M0 0 l-9 -7 v14 Z" fill="#dff6fc" opacity="0.55"/>
      <circle cx="21" cy="-1" r="1.4" fill="#15658a" opacity="0.6"/>
    </g>
  </g>
  <g transform="translate(0,182)">
    <g class="fish f2">
      <path d="M0 0 q11 -7 22 0 q-11 7 -22 0 Z" fill="#e6faff" opacity="0.4"/>
      <path d="M0 0 l-7 -6 v12 Z" fill="#e6faff" opacity="0.4"/>
    </g>
  </g>

  <!-- seabed -->
  <path d="M0 298 Q45 290 90 296 T180 294 T270 297 T360 293 T400 297 L400 320 L0 320 Z" fill="#dcc796"/>
  <path d="M0 307 Q70 301 140 306 T280 304 T400 307 L400 320 L0 320 Z" fill="#c7ae76"/>
  <ellipse cx="90" cy="313" rx="9" ry="4" fill="#b89e66"/>
  <ellipse cx="322" cy="315" rx="12" ry="4.5" fill="#b89e66"/>
  <ellipse cx="238" cy="312" rx="7" ry="3" fill="#b89e66"/>

  <!-- seaweed -->
  <g fill="none" stroke="#2f8f5f" stroke-linecap="round">
    <path class="weed" d="M42 300 C30 274 52 256 40 228 C33 212 46 202 52 194" stroke-width="8"/>
    <path class="weed slow" d="M366 302 C354 278 374 260 364 236 C358 222 368 212 374 206" stroke-width="7"/>
    <path class="weed slow" d="M82 303 C74 288 86 278 80 264" stroke-width="5"/>
  </g>

  <!-- ============ RIDER + BIKE ============ -->
  <g class="float">
    <!-- TAIL (behind everything) -->
    <path d="M152 132 C120 124 96 92 114 62 C123 47 145 49 149 65"
          fill="none" stroke="#f0913f" stroke-width="12" stroke-linecap="round"/>
    <path d="M101 88 q7 -8 14 -2 M106 108 q7 -7 14 -1"
          fill="none" stroke="#d9782a" stroke-width="3" stroke-linecap="round"/>
    <path d="M127 56 q7 -8 13 -3" fill="none" stroke="#d9782a" stroke-width="3" stroke-linecap="round"/>

    <!-- wheels -->
    <g>
      <!-- rear -->
      <circle cx="115" cy="225" r="45" fill="none" stroke="#3a3f4b" stroke-width="7"/>
      <circle cx="115" cy="225" r="38" fill="none" stroke="#9fb3c6" stroke-width="3"/>
      <g stroke="#b9cad9" stroke-width="2">
        <line x1="115" y1="225" x2="153" y2="225"/>
        <line x1="115" y1="225" x2="141.9" y2="251.9"/>
        <line x1="115" y1="225" x2="115" y2="263"/>
        <line x1="115" y1="225" x2="88.1" y2="251.9"/>
        <line x1="115" y1="225" x2="77" y2="225"/>
        <line x1="115" y1="225" x2="88.1" y2="198.1"/>
        <line x1="115" y1="225" x2="115" y2="187"/>
        <line x1="115" y1="225" x2="141.9" y2="198.1"/>
        <animateTransform attributeName="transform" type="rotate"
                          from="0 115 225" to="360 115 225" dur="2.4s" repeatCount="indefinite"/>
      </g>
      <circle cx="115" cy="225" r="6" fill="#3a3f4b"/>
      <!-- front -->
      <circle cx="285" cy="225" r="45" fill="none" stroke="#3a3f4b" stroke-width="7"/>
      <circle cx="285" cy="225" r="38" fill="none" stroke="#9fb3c6" stroke-width="3"/>
      <g stroke="#b9cad9" stroke-width="2">
        <line x1="285" y1="225" x2="323" y2="225"/>
        <line x1="285" y1="225" x2="311.9" y2="251.9"/>
        <line x1="285" y1="225" x2="285" y2="263"/>
        <line x1="285" y1="225" x2="258.1" y2="251.9"/>
        <line x1="285" y1="225" x2="247" y2="225"/>
        <line x1="285" y1="225" x2="258.1" y2="198.1"/>
        <line x1="285" y1="225" x2="285" y2="187"/>
        <line x1="285" y1="225" x2="311.9" y2="198.1"/>
        <animateTransform attributeName="transform" type="rotate"
                          from="0 285 225" to="360 285 225" dur="2.4s" repeatCount="indefinite"/>
      </g>
      <circle cx="285" cy="225" r="6" fill="#3a3f4b"/>
    </g>

    <!-- frame -->
    <g fill="none" stroke="#2f9e8f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <line x1="200" y1="225" x2="176" y2="160"/>
      <line x1="200" y1="225" x2="260" y2="174"/>
      <line x1="178" y1="163" x2="256" y2="154"/>
      <line x1="200" y1="225" x2="115" y2="225"/>
      <line x1="176" y1="160" x2="115" y2="225"/>
      <line x1="256" y1="154" x2="285" y2="225"/>
    </g>

    <!-- polka dots on the frame -->
    <g fill="#f4fbff">
      <circle cx="195.2" cy="212" r="3.4"/>
      <circle cx="190.4" cy="199" r="3.4"/>
      <circle cx="185.6" cy="186" r="3.4"/>
      <circle cx="180.8" cy="173" r="3.4"/>
      <circle cx="212" cy="214.8" r="3.4"/>
      <circle cx="224" cy="204.6" r="3.4"/>
      <circle cx="236" cy="194.4" r="3.4"/>
      <circle cx="248" cy="184.2" r="3.4"/>
      <circle cx="193.6" cy="161.2" r="3.4"/>
      <circle cx="209.2" cy="159.4" r="3.4"/>
      <circle cx="224.8" cy="157.6" r="3.4"/>
      <circle cx="240.4" cy="155.8" r="3.4"/>
      <circle cx="183" cy="225" r="3.4"/>
      <circle cx="166" cy="225" r="3.4"/>
      <circle cx="149" cy="225" r="3.4"/>
      <circle cx="132" cy="225" r="3.4"/>
      <circle cx="163.8" cy="173" r="3.4"/>
      <circle cx="151.6" cy="186" r="3.4"/>
      <circle cx="139.4" cy="199" r="3.4"/>
      <circle cx="127.2" cy="212" r="3.4"/>
      <circle cx="261.8" cy="168.2" r="3.4"/>
      <circle cx="267.6" cy="182.4" r="3.4"/>
      <circle cx="273.4" cy="196.6" r="3.4"/>
      <circle cx="279.2" cy="210.8" r="3.4"/>
    </g>

    <circle cx="200" cy="225" r="9" fill="#2f9e8f"/>
    <circle cx="200" cy="225" r="4" fill="#e8f4ff"/>

    <!-- saddle -->
    <path d="M150 160 Q160 147 180 152 L184 158 Q166 165 150 160 Z" fill="#3a3f4b"/>

    <!-- handlebar + stem -->
    <path d="M256 154 L256 136" fill="none" stroke="#3a3f4b" stroke-width="7" stroke-linecap="round"/>
    <path d="M256 136 C256 116 282 114 286 132" fill="none" stroke="#3a3f4b" stroke-width="7" stroke-linecap="round"/>
    <circle cx="256" cy="130" r="5" fill="#f2c94c" stroke="#3a3f4b" stroke-width="2"/>

    <!-- crank + pedal -->
    <line x1="200" y1="225" x2="214" y2="243" stroke="#3a3f4b" stroke-width="5" stroke-linecap="round"/>
    <rect x="207" y="241" width="16" height="6" rx="2" fill="#3a3f4b"/>

    <!-- ============ CAT ============ -->
    <!-- body -->
    <ellipse cx="188" cy="118" rx="38" ry="25" transform="rotate(-20 188 118)" fill="#f0913f"/>
    <circle cx="156" cy="127" r="20" fill="#f0913f"/>

    <!-- neck -->
    <ellipse cx="226" cy="104" rx="12" ry="15" transform="rotate(24 226 104)" fill="#f0913f"/>

    <!-- body stripes -->
    <g fill="none" stroke="#d9782a" stroke-width="3.2" stroke-linecap="round">
      <path d="M161 102 q6 8 2 16"/>
      <path d="M174 97 q7 9 3 18"/>
      <path d="M188 95 q7 9 3 18"/>
      <path d="M160 128 q8 5 15 2"/>
    </g>

    <!-- cream chest/belly -->
    <ellipse cx="209" cy="127" rx="16" ry="14" transform="rotate(-22 209 127)" fill="#fff3e2"/>

    <!-- hind leg -->
    <path d="M164 138 Q180 192 206 234" fill="none" stroke="#f0913f" stroke-width="16" stroke-linecap="round"/>
    <ellipse cx="210" cy="239" rx="10" ry="6.5" fill="#fff3e2" transform="rotate(22 210 239)"/>

    <!-- front leg (far) -->
    <path d="M220 122 Q248 126 272 121" fill="none" stroke="#d9782a" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="272" cy="121" rx="8" ry="6.5" fill="#f6e6cf" transform="rotate(-20 272 121)"/>

    <!-- front leg (near) -->
    <path d="M227 115 Q255 118 281 124" fill="none" stroke="#f0913f" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="281" cy="124" rx="9" ry="7" fill="#fff3e2" transform="rotate(-8 281 124)"/>

    <!-- ears -->
    <path d="M219 62 L211 36 L236 55 Z" fill="#f0913f"/>
    <path d="M222 59 L218 44 L231 53 Z" fill="#f2a7b3"/>
    <path d="M249 56 L264 33 L269 61 Z" fill="#f0913f"/>
    <path d="M252 56 L262 42 L266 58 Z" fill="#f2a7b3"/>

    <!-- head -->
    <circle cx="239" cy="78" r="23" fill="#f0913f"/>

    <!-- forehead stripes -->
    <g fill="none" stroke="#d9782a" stroke-width="3" stroke-linecap="round">
      <path d="M231 63 q3 -6 7 -3"/>
      <path d="M239 61 q3 -6 7 -3"/>
      <path d="M247 63 q3 -5 7 -2"/>
    </g>

    <!-- muzzle -->
    <ellipse cx="245" cy="91" rx="14" ry="10" fill="#fff3e2"/>
    <path d="M244 84 L251 84 L247.5 89 Z" fill="#e0778a"/>
    <path d="M247.5 89 v3 M247.5 92 q-5 4 -9 0 M247.5 92 q5 4 9 0"
          fill="none" stroke="#a9603f" stroke-width="1.6" stroke-linecap="round"/>

    <!-- eyes -->
    <ellipse cx="227" cy="76" rx="4.5" ry="5.5" fill="#2f3640"/>
    <ellipse cx="250" cy="73" rx="4.5" ry="5.5" fill="#2f3640"/>
    <circle cx="228.5" cy="74" r="1.5" fill="#ffffff"/>
    <circle cx="251.5" cy="71" r="1.5" fill="#ffffff"/>

    <!-- whiskers -->
    <g fill="none" stroke="#a9603f" stroke-width="2" stroke-linecap="round" opacity="0.75">
      <path d="M256 88 q13 -3 20 -8"/>
      <path d="M257 92 q13 1 20 0"/>
      <path d="M255 96 q12 4 18 9"/>
      <path d="M234 91 q-10 0 -17 -2"/>
      <path d="M234 95 q-10 2 -16 5"/>
    </g>

    <!-- speed lines -->
    <g class="speed" fill="none" stroke="#eafcff" stroke-width="4" stroke-linecap="round">
      <path d="M52 196 h-24"/>
      <path d="M60 214 h-32"/>
      <path d="M52 232 h-22"/>
    </g>
  </g>

  <!-- foreground bubbles -->
  <g fill="#eafcff">
    <g class="bubble" style="animation-duration:13s; animation-delay:-2s">
      <circle cx="70" cy="286" r="4" opacity="0.8"/>
    </g>
    <g class="bubble" style="animation-duration:17s; animation-delay:-9s">
      <circle cx="96" cy="268" r="2.6" opacity="0.75"/>
    </g>
    <g class="bubble" style="animation-duration:11s; animation-delay:-5s">
      <circle cx="334" cy="282" r="5" opacity="0.8"/>
    </g>
    <g class="bubble" style="animation-duration:15s; animation-delay:-1s">
      <circle cx="356" cy="258" r="3" opacity="0.7"/>
    </g>
    <g class="bubble" style="animation-duration:19s; animation-delay:-12s">
      <circle cx="200" cy="290" r="4" opacity="0.7"/>
    </g>
    <g class="bubble" style="animation-duration:12s; animation-delay:-7s">
      <circle cx="300" cy="272" r="2.4" opacity="0.75"/>
    </g>
    <g class="bubble" style="animation-duration:16s; animation-delay:-3s">
      <circle cx="152" cy="276" r="2.4" opacity="0.7"/>
    </g>
    <g class="bubble" style="animation-duration:14s; animation-delay:-10s">
      <circle cx="252" cy="286" r="3.4" opacity="0.75"/>
    </g>

    <!-- little bubbles drifting off the cat -->
    <g class="bubble" style="animation-duration:9s; animation-delay:-1s">
      <circle cx="286" cy="106" r="3" opacity="0.85"/>
    </g>
    <g class="bubble" style="animation-duration:10s; animation-delay:-4s">
      <circle cx="297" cy="96" r="2.2" opacity="0.8"/>
    </g>
    <g class="bubble" style="animation-duration:8s; animation-delay:-6s">
      <circle cx="308" cy="88" r="1.6" opacity="0.8"/>
    </g>
  </g>
</svg>
